# Weapon identifiers and the names the game shows for them.
#
# The two vocabularies do not resemble each other often enough to be joined by string
# manipulation: the save calls this character's third weapon WeaponBarbarian-03 and the
# interface calls it Tempest Battle Axes. A rule written from a guide names the second
# and a save holds the first, so without this file neither can be checked against the
# other at all.
#
# The mapping is positional, and the position alone would be an inference. What settles
# it is an anchor from a source that does not share a mechanism with the blacksmith
# screen: on the character screen the fourth weapon was the selected one, its panel
# named it Bloodgod's Legacy, and the save's weaponpercharacters domain gives that
# character's equipped weapon as WeaponBarbarian-04. Two unrelated readings agree on the
# same position, so the row order is the identifier order.
#
# That save reading is stated here in prose and not in the evidence of the record it
# supports, because none of the four classes describes reading the player's own save.
# It is the strongest single piece of evidence in this pack and the only one a reader
# cannot get at mechanically, which is an argument for a class that covers it.
#
# Only the pilot character is covered. The other twenty-two are absent rather than
# guessed at, and their absence is a gap the resolver reports by name.

[[weapon]]
id = "WeaponBarbarian-01"
display = "Barbaric Cleavers"
character = "Barbarian"
confidence = 0.95

[[weapon.evidence]]
type = "game_screen"
fixture = "panel_1896x2097_20260809-004014.png"
window = "1896x2097"
build_id = "1.5d2"

