# Everything below is generated by tools/extract_runes.py and reviewed before it lands.
# Regenerate it on a new game build; the diff is what the staleness rule asks for.
#
# These records are joined rather than read: the install holds the identifier and the
# skill tree node that grants it, the wiki holds the display name and the soulstone
# threshold, and the two meet because a character's tier 2, 3 and 4 nodes grant one rune
# each against thresholds of 30,000, 60,000 and a third. That is a rule, so it is tested
# rather than trusted. Four pairs settled by other means are asserted in the extractor
# and it refuses to emit anything when the rule stops reproducing them, which is also
# what would catch a patch that renumbers a tree.
