# It also settles the magnitude, which two community sources put at 25% against the
# spreadsheet's 50%. The game stores 50. The parameter was not identified by sitting
# near this record: the same rule was applied to every rune, and for twenty of them it
# reproduces every number the wiki prints, so the field is established before this one
# is read. The five it contradicts are all runes the game has since rebalanced, and one
# of those moved down, so this is a stale wiki rather than a scaling error.
