# Rune identifiers and the names the game shows for them.
#
# Some pairs here are near enough to be guessable and some are not: RuneCriticalMastery
# is "Critical Mastery", while RuneExtraCritChance is "Vulnerable Target". A resolver
# that derived one from the other by string manipulation would be right often enough to
# be trusted and wrong exactly where the names diverge, which is the worst arrangement
# available.
#
# Two kinds of evidence appear below and they are not equal. A pair read off a tooltip
# is the game stating both vocabularies in one frame. A pair joined through an effect
# description is an inference: the spreadsheet gives a name and an effect, the save
# gives an identifier that describes the same effect, and the two are matched on that
# description. That is sound where the effect is distinctive and it is still weaker
# than being told, so those records carry the lower confidence and are worth upgrading
# whenever a tooltip for one of them is captured.
#
# Three runes are one rune with a type selector, which the naming hides. Skill
# Affinity, Skill Inclination and Skill Mastery each appear once in the interface and
# open a dialog of the fifteen skill types, and the game states that each type selected
# consumes one versatility slot. So the interface labels a whole family "Skill Affinity"
# while the save writes RuneAffinityElectric and RuneAffinityNature, and the label alone
# cannot be a catalog display name because it is not unique per identifier. The
# qualified name the wiki and the spreadsheet use is, and that is what the records below
# carry.
#
# Nothing the pilot build refers to is missing from this file any more, and the last
# two entries are worth reading as a pair, because between them they are the argument
# for how this catalog is built.
#
# The save held RuneAffinityElectric and no identifier containing "Inclination", while
# the build asked for Skill Inclination: Electric. Two readings fitted equally: the
# interface's Inclination was written as RuneAffinityElectric, or Inclination had simply
# never been written to this save. The spelling favoured the second, and the spelling is
# exactly what cannot be trusted here, since the same file records RuneStartWeaponSkill
# for a rune the interface calls Weapon Expert.
#
# Two experiments settled it instead. Equipping Skill Affinity with the Electric type
# into an empty preset added RuneAffinityElectric, so that identifier is Affinity's.
# Adding Skill Inclination with the Electric type to the same preset added
# RuneInclinationElectric, the first occurrence of that string anywhere in the save.
# The convention turned out to be regular, which is a fact now rather than a hope: the
# reading a resemblance rule would have produced is right here, and the only reason to
# believe it is that neither experiment came out the other way.

[[rune]]
id = "RuneRerollMastery"
display = "Reroll Mastery"
slot = "versatility"
effect = "one extra reroll every five levels"
# The tooltip states the display name, the effect and a runic power cost of zero in the
# same frame, and the identifier is in the save's rune presets.
confidence = 1.0

