# Joined on the effect, and that join is unique in both directions rather than merely
# plausible. Of the 73 tenacity runes the spreadsheet lists, two mention a boss at all,
# and the other is Decapitator, an instant kill whose own candidate identifier
# (RuneChanceToKill) is present in the save separately. Of every rune identifier the
# save holds, exactly one names a boss. Neither side has a second claimant.
#
# The install has since confirmed the pair by a route that does not use the effect at
# all: the Necromancer's tier 2 node grants this identifier and the wiki names Lord's
# Bane at that tier's threshold. The install also settles the scope the two sources
# argued over, in the game's own words, "whenever a Lord of the Void is alive", so the
# effect above now says that and the spreadsheet's "any boss, including titans and the
# cathedral final boss" is dropped. The percentage is stored separately from that prose
# and now reads 30, against the 25% the guide and the wiki both give. So one source was
# right about the scope and wrong about the number, and the other the reverse, which is
# the argument for recording a disagreement rather than picking a winning source.
runic_power_cost = 3
unlocked_by = "Necromancer_T02S01"
parameters = [30.0]
confidence = 0.9

