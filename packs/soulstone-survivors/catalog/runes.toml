# Rune identifiers and the names the game shows for them.
#
# Some pairs here are near enough to be guessable and some are not: RuneCriticalMastery
# is "Critical Mastery", while RuneExtraCritChance is "Vulnerable Target". A resolver
# that derived one from the other by string manipulation would be right often enough to
# be trusted and wrong exactly where the names diverge, which is the worst arrangement
# available.
#
# Two kinds of evidence appear below and they are not equal. A pair read off a tooltip
# is the game stating both vocabularies in one frame. A pair joined through an effect
# description is an inference: the spreadsheet gives a name and an effect, the save
# gives an identifier that describes the same effect, and the two are matched on that
# description. That is sound where the effect is distinctive and it is still weaker
# than being told, so those records carry the lower confidence and are worth upgrading
# whenever a tooltip for one of them is captured.
#
# Absent on purpose: "Skill Inclination: Electric", which the pilot build needs.
#
# What is known about that gap is worth writing down, because the obvious answer is a
# trap. No identifier containing "Inclination" exists in any slot of any domain of the
# save, while RuneAffinityElectric does, and it sits in a versatility slot of the preset
# that otherwise matches the pilot build. The spreadsheet and the wiki agree that Skill
# Affinity and Skill Inclination are two different runes with two different unlock
# conditions, prestige 30 and prestige 60 on the same character. So either the internal
# name for the rune the interface calls Inclination is RuneAffinityElectric, and it is
# Affinity that has never been written to this save, or the reverse holds. Nothing
# available decides it, and taking the reading that matches the spelling is exactly the
# resemblance rule this file exists to refuse. The resolver names it as missing.

[[rune]]
id = "RuneRerollMastery"
display = "Reroll Mastery"
slot = "versatility"
effect = "one extra reroll every five levels"
# The tooltip states the display name, the effect and a runic power cost of zero in the
# same frame, and the identifier is in the save's rune presets.
confidence = 1.0

