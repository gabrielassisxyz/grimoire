# The skill type families, which are the one place a naming rule is used to produce a
# display name instead of a record reading one. It is used here and nowhere else, for
# reasons this file argues against everywhere above, so the reasons are worth stating.
#
# The rule is Rune<Family><Type> to "Skill <Family>: <Type>". Three of its outputs were
# established before it existed, two of them by equipping the rune and reading the save
# back, and the extractor refuses to emit any of these unless it still reproduces all
# three. The set of types is not written down either: it is taken as the suffixes all
# three families share, so an identifier that only one family has cannot enter as a type.
# Forty-five identifiers come out, three families of the same fifteen.
#
# What makes this different from the resemblance rules rejected elsewhere is that the
# alternative is not a better source, it is no source. No wiki table lists these, no
# skill tree node grants them, and the interface shows one label for a whole family, so
# a record per identifier can only come from the rule or from fifteen tooltips per
# family. They stay at 0.9 and a tooltip would still upgrade any of them.
#
# The prefix has to be anchored and the suffix has to be a known type, because
# RuneCriticalMastery, RuneDashMastery, RuneMulticastMastery and RuneRerollMastery all
# contain "Mastery" and belong to none of this. A looser rule would name them.

