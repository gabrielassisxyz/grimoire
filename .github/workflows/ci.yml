name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0 # no moving v9 major tag published; pin exact
        with:
          enable-cache: true
      - run: uv sync
      - run: ./bin/ci

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Run the gitleaks CLI directly (same binary and rules as the local pre-commit
      # hook) instead of gitleaks-action, which wants a write token so it can post PR
      # comments. Granting write to a job that only reads the tree is the wrong trade on
      # a public repo. Deterministic pass or fail, no permissions dance.
      - name: Secret scan (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact
